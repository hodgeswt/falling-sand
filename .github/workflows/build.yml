name: Build
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build and push'
        required: false
        default: 'false'

concurrency:
  group: Build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect component changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            config:
              - 'build.mfs'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.json'
            src:
              - 'src/**'

      - name: Determine build tag
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        id: determine-build-tag
        run: |
          echo "build_tag=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Login to Docker
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        run: |
          docker build . -t falling-sand:${{ steps.determine-build-tag.outputs.build_tag }}

      - name: Tag and push
        if: steps.filter.outputs.src == 'true' || steps.filter.outputs.config == 'true' || github.event.inputs.force == 'true'
        run: |
          docker tag falling-sand:${{ steps.determine-build-tag.outputs.build_tag }} hodgeswt/falling-sand:${{ steps.determine-build-tag.outputs.build_tag }}
          docker tag falling-sand:${{ steps.determine-build-tag.outputs.build_tag }} hodgeswt/falling-sand:latest
          docker push hodgeswt/falling-sand:${{ steps.determine-build-tag.outputs.build_tag }}
          docker push hodgeswt/falling-sand:latest