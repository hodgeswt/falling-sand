<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#2c3e50" rx="4"/>
  
  <!-- Sand particles falling - different sizes and positions -->
  <!-- Top layer -->
  <circle cx="8" cy="6" r="1.5" fill="#f4d03f" opacity="0.9"/>
  <circle cx="16" cy="4" r="1.5" fill="#f5b041" opacity="0.9"/>
  <circle cx="24" cy="7" r="1.5" fill="#f4d03f" opacity="0.9"/>
  
  <!-- Middle layer -->
  <circle cx="6" cy="11" r="1.5" fill="#f5b041" opacity="0.95"/>
  <circle cx="12" cy="10" r="1.5" fill="#f39c12" opacity="0.95"/>
  <circle cx="20" cy="12" r="1.5" fill="#f4d03f" opacity="0.95"/>
  <circle cx="26" cy="13" r="1.5" fill="#f5b041" opacity="0.95"/>
  
  <!-- Lower middle layer -->
  <circle cx="10" cy="16" r="1.5" fill="#f39c12" opacity="1"/>
  <circle cx="16" cy="15" r="1.5" fill="#f4d03f" opacity="1"/>
  <circle cx="23" cy="17" r="1.5" fill="#f5b041" opacity="1"/>
  
  <!-- Accumulated sand pile at bottom -->
  <ellipse cx="16" cy="27" rx="11" ry="4" fill="#e67e22" opacity="0.8"/>
  <ellipse cx="16" cy="26" rx="10" ry="3.5" fill="#f39c12"/>
  
  <!-- Additional particles near bottom -->
  <circle cx="8" cy="22" r="1.5" fill="#f39c12"/>
  <circle cx="14" cy="21" r="1.5" fill="#f5b041"/>
  <circle cx="18" cy="20" r="1.5" fill="#f4d03f"/>
  <circle cx="24" cy="23" r="1.5" fill="#f39c12"/>
</svg>