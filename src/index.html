<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>falling sand</title>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="page">
      <h1>Falling Sand</h1>
      <div id="game-container">
        <canvas id="game">
          Your browser does not support the HTML5 canvas tag.
        </canvas>
      </div>
      <!-- Config Edit Modal -->
      <div id="config-modal" class="modal" style="display:none;">
        <div class="modal-content">
          <h2>Edit Configuration</h2>
          <form id="config-form">
            <label>Grain Size </label>
            <input type="number" name="grainSize" />
            <label>Color Mode</label>
            <select name="grainColorMode">
              <option value="Static">Static</option>
              <option value="Rainbow">Rainbow</option>
            </select>
            <label>Grain Base Color</label>
            <input type="color" name="grainBaseColor" />
            <label>Ground Color </label>
            <input type="color" name="groundColor" />
            <label>Empty Color </label>
            <input type="color" name="emptyColor" />
            <label>Color Variation </label>
            <input type="number" name="colorVariation" />
            <div class="modal-actions">
              <button type="submit">Save</button>
              <button type="button" id="cancel-modal">Cancel</button>
              <button type="button" id="reset-default-config" style="margin-left:auto;">Reset to Default</button>
            </div>
          </form>
        </div>
      </div>
      <button id="open-config-modal" class="config-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/></svg></button>
      <button id="open-info-modal" class="info-btn" title="About"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M272 112C272 85.5 293.5 64 320 64C346.5 64 368 85.5 368 112C368 138.5 346.5 160 320 160C293.5 160 272 138.5 272 112zM224 256C224 238.3 238.3 224 256 224L320 224C337.7 224 352 238.3 352 256L352 512L384 512C401.7 512 416 526.3 416 544C416 561.7 401.7 576 384 576L256 576C238.3 576 224 561.7 224 544C224 526.3 238.3 512 256 512L288 512L288 288L256 288C238.3 288 224 273.7 224 256z"/></svg></button>
      <!-- Info Modal -->
      <div id="info-modal" class="modal" style="display:none;">
        <div class="modal-content">
          <h2>About</h2>
          <div class="info-block">
            <p><strong>My name:</strong> Will Hodges</p>
            <p><strong>Github:</strong> <a href="https://github.com/hodgeswt" target="_blank">github.com/hodgeswt</a></p>
            <p><strong>My other project:</strong> <a href="https://cinemadle.com" target="_blank">cinemadle.com</a></p>
            <p class="info-text">Coded by me. AI helped with dark-mode styling, css, and the modal dialogs</p>
          </div>
          <div class="modal-actions">
            <button type="button" id="close-info-modal">Close</button>
          </div>
        </div>
      </div
    </div>
  </body>
</html>
